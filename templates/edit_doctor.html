{% extends "base.html" %}

{% block title %}Edit Doctor - Hospital Management System{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const specializationSelect = document.getElementById('specialization');
    const otherSpecializationInput = document.getElementById('other_specialization');
    
    specializationSelect.addEventListener('change', function() {
        if (this.value === 'Other') {
            otherSpecializationInput.style.display = 'block';
            otherSpecializationInput.required = true;
        } else {
            otherSpecializationInput.style.display = 'none';
            otherSpecializationInput.required = false;
        }
    });
    
    // Initialize on page load
    if (specializationSelect.value === 'Other') {
        otherSpecializationInput.style.display = 'block';
        otherSpecializationInput.required = true;
    }
});
</script>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3">
                <i class="bi bi-person-badge"></i> Edit Doctor
            </h1>
            <a href="{{ url_for('manage_doctors') }}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Back to Doctors
            </a>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Doctor Details</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ doctor.user.username if doctor.user else '' }}" disabled>
                        <div class="form-text">Username cannot be changed</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ doctor.name }}" required>
                        <div id="name_error" class="text-danger small" style="display: none;"></div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="specialization" class="form-label">Specialization</label>
                        <select class="form-select" id="specialization" name="specialization" required>
                            <option value="">Select Specialization</option>
                            {% for spec in specializations %}
                                <option value="{{ spec }}" {% if doctor.specialization == spec %}selected{% endif %}>{{ spec }}</option>
                            {% endfor %}
                            <option value="Other">Other (Specify)</option>
                        </select>
                        <input type="text" class="form-control mt-2" id="other_specialization" name="other_specialization" placeholder="Enter specialization" style="display: none;">
                        <div id="specialization_error" class="text-danger small" style="display: none;"></div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phone" name="phone" value="{{ doctor.phone or '' }}">
                        <div id="phone_error" class="text-danger small" style="display: none;"></div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ doctor.user.email if doctor.user else '' }}" required>
                        <div id="email_error" class="text-danger small" style="display: none;"></div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
